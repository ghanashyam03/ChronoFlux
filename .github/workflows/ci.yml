name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Node.js ${{ matrix.node-version }} on ubuntu-latest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Collect test coverage
        run: npm run test:coverage

      - name: Pack package archive
        run: npm pack

      - name: Verify external consumer
        run: |
          cd test-consumer
          npm install
          node consumer.js
          npx tsc --project tsconfig.json
          node dist-consumer/consumer.js
